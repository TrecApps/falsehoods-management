<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        lang="en"
>
<head>
    <title>Falsehoods Welcome</title>
    <base th:href="${baseUrl}" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous">

    <link href="styles/falsehood-styles.css" rel="stylesheet" />
    <link href="styles/nav-bar.css" rel="stylesheet" />
    <link href="styles/tc-styles.css" rel="stylesheet" />
    <link href="styles/article-styles.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <link href="styles/popup.css" rel="stylesheet" />
    <link href="styles/color-picker.css" rel="stylesheet" />
    <script src="js/popup.js" defer></script>
    <script src="js/notification.js"></script>
</head>

<body>
    <script th:inline="javascript">
        var elementItemSetting = [[${elementItemSetting}]]
        var elementItemSettingOrig = [[${elementItemSetting}]]

        var elementContainerSetting = [[${elementContainerSetting}]]
        var elementContainerSettingOrig = [[${elementContainerSetting}]]

        const falsehoodCountTable = [[${falsehoodCountTable}]]
    </script>

    <div th:replace="~{fragments/topbar :: bar}"></div>

    <div style="height:50px"></div>
    <h2 th:text="${brandName}"></h2>
    <hr>
    <div class="rs-article-container">
        <div class="rs-metadata-container">
            <div th:if="${brandPic != null}" class="rs-image-container">
                <div class="rs-image-holder">
                    <img th:src="${brandPic}">
                </div>
                <div th:if="${imgDesc != null}" class="rs-image-desc-holder">
                    <p class="rs-image-desc" th:text="${imgDesc}"></p>
                </div>
            </div>

            <div class="rs-metadata-holder rs-table-holder">
                <table id="falsehood-count-table">
                    <thead>
                        <tr>
                            <th rowspan="2">Severity</th>
                            <th colspan="2" id="culprit-header" style="cursor:pointer;" title="Search all culprit falsehoods">Culprit</th>
                            <th colspan="2" id="target-header" style="cursor:pointer;" title="Search all target falsehoods">Target</th>
                        </tr>
                        <tr>
                            <th id="culprit-accept-col" style="cursor:pointer;" title="Search accepted culprit falsehoods">Accepted</th>
                            <th id="culprit-confirm-col" style="cursor:pointer;" title="Search confirmed culprit falsehoods">Confirmed</th>
                            <th id="target-accept-col" style="cursor:pointer;" title="Search accepted target falsehoods">Accepted</th>
                            <th id="target-confirm-col" style="cursor:pointer;" title="Search confirmed target falsehoods">Confirmed</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr data-severity="OPPOSING_EVIDENCE_WITHHELD">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Opposing Evidence Withheld</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                        </tr>
                        <tr data-severity="SUPPORTING_EVIDENCE_WITHHELD">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Supporting Evidence Withheld</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                        </tr>
                        <tr data-severity="SUBJECTIVE">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Subjective</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.SUBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.SUBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.SUBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.SUBJECTIVE}"></td>
                        </tr>
                        <tr data-severity="NARRATIVE_ISSUE">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Narrative Issue</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.NARRATIVE_ISSUE}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.NARRATIVE_ISSUE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.NARRATIVE_ISSUE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.NARRATIVE_ISSUE}"></td>
                        </tr>
                        <tr data-severity="FAULTY_LOGIC">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Faulty Logic</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.FAULTY_LOGIC}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.FAULTY_LOGIC}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.FAULTY_LOGIC}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.FAULTY_LOGIC}"></td>
                        </tr>
                        <tr data-severity="TITLE_OR_SLOGAN">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Title / Slogan</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.TITLE_OR_SLOGAN}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.TITLE_OR_SLOGAN}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.TITLE_OR_SLOGAN}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.TITLE_OR_SLOGAN}"></td>
                        </tr>
                        <tr data-severity="OBJECTIVE">
                            <td class="severity-cell" style="cursor:pointer;" title="Search all falsehoods in this category">Objective</td>
                            <td class="count-cell" data-culprit="true" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedCulpritCount.OBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="true" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedCulpritCount.OBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="ACCEPTED" style="cursor:pointer;" th:text="${falsehoodCountTable.acceptedTargetCount.OBJECTIVE}"></td>
                            <td class="count-cell" data-culprit="false" data-status="CONFIRMED" style="cursor:pointer;" th:text="${falsehoodCountTable.confirmedTargetCount.OBJECTIVE}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<div class="container">
    <div class="search-container" id="search-container" hidden>
        <p id="showing-p"></p>
        <div th:class="${elementContainerSetting} + ' element-container'" style="width: 100%;" id="result-holder">

        </div>
        <div class="flex-and-center" style="gap: 10px;margin: 10px;">
            <!--ToDo: Create stylized buttons-->
            <button type="button" class="arrow-button" id="back-button" disabled>
                <img src="images/icons/botton-Arrow-B.png" width="90%" height="90%"/>
                Previous
            </button>
            <div>
                <p style="margin: auto;" id="page-p"></p>
            </div>
            <button type="button" class="arrow-button" id="forward-button">
                Next
                <img src="images/icons/botton-Arrow-B.png" width="90%" height="90%" style="transform: rotate(180deg);"/>
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const falsehoodServiceUrl = [[${falsehoodServiceUrl}]]

    let brandId = [[${brandId}]]

    function parseResults(resultsQuery) {
        let results = resultsQuery.results;
        let totalCount = resultsQuery.totalCountPrimitive;
        document.getElementById("search-container").hidden = false;
        let resultHolder = document.getElementById("result-holder");
        resultHolder.replaceChildren();

        for (let result of results) {
            let resultParent = document.createElement("div");
            resultParent.classList.add("element-item");
            resultParent.classList.add(elementItemSetting);
            resultParent.addEventListener("click", () => {
                window.location = `${falsehoodServiceUrl}/Falsehood/${result.id}`;
            });
            resultHolder.appendChild(resultParent);

            let titleDiv = document.createElement("div");
            titleDiv.classList.add("flex-and-center");
            titleDiv.textContent = result.title;
            resultParent.appendChild(titleDiv);

            resultParent.appendChild(document.createElement("hr"));

            let detailsDiv = document.createElement("div");
            detailsDiv.style.gap = "5px";
            detailsDiv.style.flexFlow = "row wrap";
            resultParent.appendChild(detailsDiv);

            let pElement = document.createElement("p");
            pElement.innerHTML = `<b>Submitted By: </b>${result.authorDisplayName}`;
            detailsDiv.appendChild(pElement);

            pElement = document.createElement("p");
            pElement.innerHTML = `<b>Date: </b>${result.dateMade}`;
            detailsDiv.appendChild(pElement);

            pElement = document.createElement("p");
            pElement.innerHTML = `<b>Severity: </b>${result.severity}`;
            detailsDiv.appendChild(pElement);

            pElement = document.createElement("p");
            pElement.innerHTML = `<b>Status: </b>${result.status}`;
            detailsDiv.appendChild(pElement);

            if (result.culprits) {
                let divBrands = document.createElement("div");
                divBrands.style.padding = "5px";
                divBrands.style.width = "100%";
                let b = document.createElement("b");
                b.textContent = "Culprits:";
                divBrands.appendChild(b);
                let first = true;
                for (let culprit of result.culprits) {
                    let sp = document.createElement("span");
                    sp.textContent = first ? `${culprit.brand.names[0]}` : `, ${culprit.brand.names[0]}`;
                    first = false;
                    divBrands.appendChild(sp);
                }
                detailsDiv.appendChild(divBrands);
            }

            if (result.targets) {
                let divBrands = document.createElement("div");
                divBrands.style.padding = "5px";
                divBrands.style.width = "100%";
                let b = document.createElement("b");
                b.textContent = "Targets:";
                divBrands.appendChild(b);
                let first = true;
                for (let target of result.targets) {
                    let sp = document.createElement("span");
                    sp.textContent = first ? `${target.brand.names[0]}` : `, ${target.brand.names[0]}`;
                    first = false;
                    divBrands.appendChild(sp);
                }
                detailsDiv.appendChild(divBrands);
            }
        }

        document.getElementById("back-button").disabled = page <= 0;
        document.getElementById("page-p").textContent = `Page: ${page}`;
        document.getElementById("forward-button").disabled = size > results.length;
        document.getElementById("showing-p").textContent = `Showing ${(size * page) + 1} - ${Math.min(size * (page + 1), totalCount)} of ${totalCount} Falsehoods`;
    }

    var page = 0;
    var size = 20;
    var searchObject;
    var status;

    // Elements currently highlighted as "active" during a search
    var activeElements = [];

    function clearActiveElements() {
        for (let el of activeElements) {
            el.classList.remove("button-dis");
        }
        activeElements = [];
    }

    function performSearch() {
        const url = new URL(`${falsehoodServiceUrl}/falsehood-search-api`);
        const params = { page, size };
        if (status && status != "null") {
            params["status"] = status;
        }
        url.search = new URLSearchParams(params).toString();

        fetch(url, {
            method: "POST",
            body: JSON.stringify(searchObject),
            headers: {
                "Content-Type": "application/json"
            }
        }).then(async (response) => {
            let results = await response.json();
            parseResults(results);
        }).finally(() => {
            clearActiveElements();
            isSearching = false;
        });
    }

    var isSearching = false;

    /**
     * @param {boolean} useCulprits - true = brand is culprit, false = brand is target
     * @param {string|null} newStatus - falsehood status filter (e.g. "ACCEPTED", "CONFIRMED"), or null for any
     * @param {string|null} severity - severity filter, or null for any
     * @param {Element[]} elementsToHighlight - table cells/rows to apply button-dis to during search
     */
    function prepSearch(useCulprits, newStatus, severity, elementsToHighlight) {
        if (isSearching) {
            return;
        }
        isSearching = true;

        // Highlight the clicked elements
        activeElements = elementsToHighlight || [];
        for (let el of activeElements) {
            el.classList.add("button-dis");
        }

        searchObject = useCulprits
            ? { culprit: brandId }
            : { target: brandId };

        if (severity) {
            searchObject.severity = severity;
        }

        status = newStatus || null;
        page = 0;
        performSearch();
    }

    function onSwitchPage(forward) {
        if (forward) {
            page++;
        } else {
            page--;
        }
        performSearch();
    }

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById("back-button").addEventListener("click", () => {
            onSwitchPage(false);
        });
        document.getElementById("forward-button").addEventListener("click", () => {
            onSwitchPage(true);
        });

        // Header sub-column clicks: filter by status only (both culprit columns)
        document.getElementById("culprit-accept-col").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="true"][data-status="ACCEPTED"]'
            ));
            prepSearch(true, "ACCEPTED", null, cols);
        });
        document.getElementById("culprit-confirm-col").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="true"][data-status="CONFIRMED"]'
            ));
            prepSearch(true, "CONFIRMED", null, cols);
        });
        document.getElementById("target-accept-col").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="false"][data-status="ACCEPTED"]'
            ));
            prepSearch(false, "ACCEPTED", null, cols);
        });
        document.getElementById("target-confirm-col").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="false"][data-status="CONFIRMED"]'
            ));
            prepSearch(false, "CONFIRMED", null, cols);
        });

        // "Culprit" spanning header: search all culprit falsehoods (both statuses)
        document.getElementById("culprit-header").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="true"]'
            ));
            prepSearch(true, null, null, cols);
        });

        // "Target" spanning header: search all target falsehoods (both statuses)
        document.getElementById("target-header").addEventListener("click", () => {
            if (isSearching) return;
            const cols = Array.from(document.querySelectorAll(
                '#falsehood-count-table tbody .count-cell[data-culprit="false"]'
            ));
            prepSearch(false, null, null, cols);
        });

        // Severity (first-column) cell clicks: search all statuses for that severity
        document.querySelectorAll('#falsehood-count-table tbody .severity-cell').forEach(cell => {
            cell.addEventListener("click", () => {
                if (isSearching) return;
                const row = cell.closest("tr");
                const severity = row.dataset.severity;
                // Highlight the whole row (all tds in this row)
                const rowCells = Array.from(row.querySelectorAll("td"));
                // Determine which side is culprit vs target by checking the count cells —
                // since we can't know which side, search all falsehoods for this brand + severity.
                // We search as culprit=brandId with severity filter (no status filter).
                // Use all row cells as the highlight target.
                prepSearch(true, null, severity, rowCells);
            });
        });

        // Individual count cell clicks: filter by exact culprit/target + status + severity
        document.querySelectorAll('#falsehood-count-table tbody .count-cell').forEach(cell => {
            cell.addEventListener("click", () => {
                if (isSearching) return;
                const row = cell.closest("tr");
                const severity = row.dataset.severity;
                const useCulprits = cell.dataset.culprit === "true";
                const cellStatus = cell.dataset.status;
                prepSearch(useCulprits, cellStatus, severity, [cell]);
            });
        });
    });
</script>

</body>
</html>

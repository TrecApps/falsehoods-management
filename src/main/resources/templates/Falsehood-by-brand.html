<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        lang="en"
>
<head>
    <title>Falsehoods Welcome</title>
    <base th:href="${baseUrl}" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous">

    <link href="styles/falsehood-styles.css" rel="stylesheet" />
    <link href="styles/nav-bar.css" rel="stylesheet" />
    <link href="styles/tc-styles.css" rel="stylesheet" />
    <link href="styles/article-styles.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <link href="styles/popup.css" rel="stylesheet" />
    <link href="styles/color-picker.css" rel="stylesheet" />
    <script src="js/popup.js" defer></script>
</head>

<body>
    <script th:inline="javascript">
        var elementItemSetting = [[${elementItemSetting}]]
        var elementItemSettingOrig = [[${elementItemSetting}]]

        var elementContainerSetting = [[${elementContainerSetting}]]
        var elementContainerSettingOrig = [[${elementContainerSetting}]]

        const falsehoodCountTable = [[${falsehoodCountTable}]]
    </script>

    <div th:replace="~{fragments/topbar :: bar}"></div>

    <div style="height:50px"></div>
    <h2 th:text="${brandName}"></h2>
    <hr>
    <div class="rs-article-container">
        <div class="rs-metadata-container">
            <div th:if="${brandPic != null}" class="rs-image-container">
                <div class="rs-image-holder">
                    <img th:src="${brandPic}">
                </div>
                <div th:if="${imgDesc != null}" class="rs-image-desc-holder">
                    <p class="rs-image-desc" th:text="${imgDesc}"></p>
                </div>
            </div>

            <div class="rs-metadata-holder rs-table-holder">
                <table>
                    <tr>
                        <td rowspan="2">Severity</td>
                        <td colspan="2">Culprit</td>
                        <td colspan="2">Target</td>
                    </tr>
                    <tr>
                        <td id="culprit-accept-col">Accepted</td>
                        <td id="culprit-confirm-col">Confirmed</td>
                        <td id="target-accept-col">Accepted</td>
                        <td id="target-confirm-col">Confirmed</td>
                    </tr>
                    <tr>
                        <td>Opposing Evidence Withheld</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.OPPOSING_EVIDENCE_WITHHELD}"></td>
                    </tr>
                    <tr>
                        <td>Supporting Evidence Withheld</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.SUPPORTING_EVIDENCE_WITHHELD}"></td>
                    </tr>
                    <tr>
                        <td>Subjective</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.SUBJECTIVE}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.SUBJECTIVE}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.SUBJECTIVE}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.SUBJECTIVE}"></td>
                    </tr>
                    <tr>
                        <td>Narrative Issue</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.NARRATIVE_ISSUE}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.NARRATIVE_ISSUE}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.NARRATIVE_ISSUE}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.NARRATIVE_ISSUE}"></td>
                    </tr>
                    <tr>
                        <td>Faulty Logic</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.FAULTY_LOGIC}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.FAULTY_LOGIC}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.FAULTY_LOGIC}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.FAULTY_LOGIC}"></td>
                    </tr>
                    <tr>
                        <td>Title/Sloagan</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.TITLE_OR_SLOGAN}"></td>
                    </tr>
                    <tr>
                        <td>Objective</td>
                        <td th:text="${falsehoodCountTable.acceptedCulpritCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.confirmedCulpritCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.acceptedTargetCount.TITLE_OR_SLOGAN}"></td>
                        <td th:text="${falsehoodCountTable.confirmedTargetCount.TITLE_OR_SLOGAN}"></td>
                    </tr>

                </table>
            </div>
        </div>
    </div>

<div class="container">
    <div class="search-container" id="search-container" hidden>
        <p id="showing-p"></p>
        <div th:class="${elementContainerSetting} + ' element-container'" style="width: 100%;" id="result-holder">

        </div>
        <div class="flex-and-center" style="gap: 10px;margin: 10px;">
            <!--ToDo: Create stylized buttons-->
            <button type="button" class="arrow-button" id="back-button" disabled>
                <img src="images/icons/botton-Arrow-B.png" width="90%" height="90%"/>
                Previous
            </button>
            <div>
                <p style="margin: auto;" id="page-p"></p>
            </div>
            <button type="button" class="arrow-button" id="forward-button">
                Next
                <img src="images/icons/botton-Arrow-B.png" width="90%" height="90%" style="transform: rotate(180deg);"/>
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const falsehoodServiceUrl = [[${falsehoodServiceUrl}]]

    let brandId = [[${brandId}]]

    function getTotalCount(countArray){
        let totalCount = 0;
        for(let countObj of countArray){
            totalCount != countObj.count;
        }
        return totalCount;
    }
    function parseResults(resultsQuery) {
            let results = resultsQuery.results;
            let totalCount = resultsQuery.totalCountPrimitive;
            document.getElementById("search-container").hidden = false;
            let resultHolder = document.getElementById("result-holder");
            resultHolder.replaceChildren();

            for(let result of results) {

                let resultParent = document.createElement("div");
                resultParent.classList.add("element-item");
                resultParent.classList.add(elementItemSetting);
                resultParent.addEventListener("click", () => {

                    window.location = `${url}/Falsehood/${result.id}`;

                });

                resultHolder.appendChild(resultParent);

                let titleDiv = document.createElement("div");
                titleDiv.classList.add("flex-and-center");
                titleDiv.textContent = result.title;
                resultParent.appendChild(titleDiv);

                resultParent.appendChild(document.createElement("hr"));

                let detailsDiv = document.createElement("div");
                detailsDiv.style.gap = "5px";
                detailsDiv.style.flexFlow = "row wrap";
                resultParent.appendChild(detailsDiv);

                let pElement = document.createElement("p");
                pElement.innerHTML = `<b>Submitted By: </b>${result.authorDisplayName}`;
                detailsDiv.appendChild(pElement);

                pElement = document.createElement("p");
                pElement.innerHTML = `<b>Date: </b>${result.dateMade}`;
                detailsDiv.appendChild(pElement);

                pElement = document.createElement("p");
                pElement.innerHTML = `<b>Severity: </b>${result.severity}`;
                detailsDiv.appendChild(pElement);

                pElement = document.createElement("p");
                pElement.innerHTML = `<b>Status: </b>${result.status}`;
                detailsDiv.appendChild(pElement);

                if(result.culprits){
                    let divBrands = document.createElement("div");
                    divBrands.style.padding = "5px";
                    divBrands.style.width = "100%";

                    let b = document.createElement("b");
                    b.textContent = "Culprits:";
                    divBrands.appendChild(b);

                    let first = true;

                    for(let culprit of result.culprits) {
                        let sp = document.createElement("span");
                        sp.textContent = first ? `${culprit.brand.names[0]}` : `, ${culprit.brand.names[0]}`;
                        first = false;
                        divBrands.appendChild(sp);
                    }
                    detailsDiv.appendChild(divBrands);
                }

                if(result.targets){
                    let divBrands = document.createElement("div");
                    divBrands.style.padding = "5px";
                    divBrands.style.width = "100%";

                    let b = document.createElement("b");
                    b.textContent = "Targets:";
                    divBrands.appendChild(b);

                    let first = true;

                    for(let target of result.targets) {
                        let sp = document.createElement("span");
                        sp.textContent = first ? `${target.brand.names[0]}` : `, ${target.brand.names[0]}`;
                        first = false;
                        divBrands.appendChild(sp);
                    }
                    detailsDiv.appendChild(divBrands);
                }


            }

            document.getElementById("back-button").disabled = page <= 0;
            document.getElementById("page-p").textContent = `Page: ${page}`;
            document.getElementById("forward-button").disabled = size > results.length;
            document.getElementById("showing-p").textContent = `Showing ${ (size * page) + 1} - ${ Math.min(size * (page + 1), totalCount) }  of ${totalCount} Falsehoods`;
    }

    var page = 0;
    var size = 20;
    var searchObject;
    var status;

    function performSearch() {

        const url = new URL(`${falsehoodServiceUrl}/falsehood-search-api`);
        const params = { page, size };

        params["status"] = status;
        // Automatically handles encoding and '?' or '&' symbols
        url.search = new URLSearchParams(params).toString();

        fetch(url, {
            method: "POST",
            body: JSON.stringify(searchObject),
            headers: {
                "Content-Type": "application/json"
            }
        }).then(async (response) => {
            let results = await response.json();
            parseResults(results);
        }).finally(() => {
            isSearching = false;
        });
    }

    var isSearching = false;
    function prepSearch(useCulprits, newStatus){

        if(isSearching){
            return;
        }
        isSearching = true;

        if(useCulprits){
            searchObject = {
                culprit: brandId
            }
        } else {
            searchObject = {
                target: brandId
            }
        }
        status = newStatus;
        performSearch();
    }

    function onSwitchPage(forward, button) {
        if(forward) {
            page++;
        } else {
            page--;
        }
        performSearch(button);
    }

    document.addEventListener('DOMContentLoaded', (event) => {
            document.getElementById("back-button").addEventListener("click", (e) => {
                onSwitchPage(false, e.target);
            });

            document.getElementById("forward-button").addEventListener("click", (e) => {
                onSwitchPage(true, e.target);
            });

            document.getElementById("culprit-accept-col").addEventListener("click", () => {
                prepSearch(true, "ACCEPTED");
            });
            document.getElementById("culprit-confirm-col").addEventListener("click", () => {
                prepSearch(true, "CONFIRMED");
            });
            document.getElementById("target-accept-col").addEventListener("click", () => {
                prepSearch(false, "ACCEPTED");
            });
            document.getElementById("target-confirm-col").addEventListener("click", () => {
                prepSearch(false, "CONFIRMED");
            });
    });
</script>

</body>
</html>

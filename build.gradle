plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
    id 'jacoco'

    id "io.spring.dependency-management" version "1.1.0"
}

dependencyManagement {
    imports {
        mavenBom("com.azure.spring:spring-cloud-azure-dependencies:7.4.0")
    }
}

group = 'com.trecapps.falsehoods'
version = '1.0-SNAPSHOT'

apply plugin: 'java'
apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

repositories {
    mavenCentral()

    maven {
        url azureRepoUrl
        name 'tcMavenRepo'
        credentials {
            username azureRepoUsername
            password azureRepoPassword
        }
    }
}

jar{
    //archiveClassifier=''
    enabled = false
}

dependencies {
    implementation 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    implementation 'net.coobird:thumbnailator:0.4.21'

    implementation 'com.trecapps:notification-base:0.0.19'

    // Basic Security help
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-azure', version: '0.0.66')
    implementation(group: 'com.trecapps.trecauth', name: 'trec-auth-mongo', version: '0.0.66')

    // Security Dependencies
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation("org.springframework.boot:spring-boot-starter-webflux")
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-quartz"
    implementation "org.springframework.boot:spring-boot-starter-data-mongodb-reactive"
    implementation "org.springframework.boot:spring-boot-starter-aspectj"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"

    // Azure Logging
    implementation "com.microsoft.azure:applicationinsights-runtime-attach:3.7.6"
    implementation "com.azure.spring:spring-cloud-azure-starter-keyvault"
    implementation 'com.azure:azure-storage-blob'

    // Source: https://mvnrepository.com/artifact/ognl/ognl
//    implementation 'ognl:ognl:3.4.11'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'net.jqwik:jqwik:1.8.5'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
}